name: build

on: push

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: Run tests
        run: go test -cover ./...
      - name: Run tests for cmd/pps-simulate
        working-directory: cmd/pps-simulate
        run: go test -cover ./...
      - name: Run benchmarks
        run: go test -bench .
